<svg xmlns="http://www.w3.org/2000/svg" width="2732" height="2732" viewBox="0 0 2732 2732">
  <!-- Launch screen. Square and oversized on purpose: iOS crops it to whatever
       device it lands on, so everything that matters sits in the middle third. -->
  <rect width="2732" height="2732" fill="#f3f2f2"/>
  <g transform="translate(1366 1300) scale(9) translate(-20 -20)">
    <circle cx="11" cy="11" r="7.5" fill="none" stroke="#201e1d" stroke-width="2.8"/>
    <circle cx="29" cy="29" r="7.5" fill="none" stroke="#201e1d" stroke-width="2.8"/>
    <line x1="33" y1="6" x2="7" y2="34" stroke="#0088b0" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <text x="1366" y="1580" text-anchor="middle"
        font-family="Georgia, 'Source Serif 4', serif" font-weight="600"
        font-size="104" letter-spacing="15" fill="#201e1d">ΙΝΤΑΚΙΝΓ</text>
</svg>
