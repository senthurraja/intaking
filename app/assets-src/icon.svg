<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon: the percent mark from the wordmark, on the paper ground.
       Strokes are heavier than the in-app logo because an icon is read at
       60px on a home screen, where the prototype's 2.4px hairlines vanish. -->
  <rect width="1024" height="1024" fill="#f3f2f2"/>
  <g transform="translate(512 512) scale(19.2) translate(-20 -20)">
    <circle cx="11" cy="11" r="7.5" fill="none" stroke="#201e1d" stroke-width="3.1"/>
    <circle cx="29" cy="29" r="7.5" fill="none" stroke="#201e1d" stroke-width="3.1"/>
    <line x1="33" y1="6" x2="7" y2="34" stroke="#0088b0" stroke-width="3.6" stroke-linecap="round"/>
  </g>
</svg>
